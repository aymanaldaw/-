<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجوزاتي - تتبع حالة الحجز</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{font-family:'Tajawal',sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:#f4f8f6;color:#0f2a23;padding:16px}
.card{background:#fff;border-radius:20px;padding:18px;max-width:500px;margin:0 auto;border:1px solid #e6f2ee}
.input{width:100%;border:1.5px solid #e6f2ee;border-radius:14px;padding:12px 14px;margin-top:8px}
.btn{width:100%;background:#0f2a23;color:#fff;border:none;padding:14px;border-radius:100px;margin-top:12px;font-weight:900;cursor:pointer}
.badge{padding:4px 10px;border-radius:100px;font-size:10px;font-weight:800}
.badge.pending{background:#fef3c7;color:#92400e}
.badge.approved{background:#d1fae5;color:#065f46}
.badge.rejected{background:#fee2e2;color:#991b1b}
.booking-card{background:#f9fdfb;border:1px solid #e6f2ee;border-radius:16px;padding:14px;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <h2 style="font-weight:900;text-align:center">📋 تتبع حجوزاتي</h2>
  <p style="font-size:11px;color:#6b8a81;text-align:center;margin-top:4px">ادخل رقم تلفونك لمعرفة حالة حجزك</p>
  <input id="phone" class="input" placeholder="09xxxxxxxx - نفس الرقم اللي حجزت بيه">
  <button class="btn" onclick="searchBookings()">🔍 بحث عن حجوزاتي</button>
  <div id="results" style="margin-top:16px"></div>
  <div style="text-align:center;margin-top:16px"><a href="index.html" style="font-size:11px;color:#6b8a81;text-decoration:none">🏠 الرئيسية</a> • <a href="payment.html" style="font-size:11px;color:#10A37F;text-decoration:none">💳 حجز جديد</a></div>
</div>
<script>
const SUPABASE_URL='https://dklfjeupbggrvxpjqqqe.supabase.co';
const SUPABASE_ANON='sb_publishable_lnGtbMJf4P4EeHV6MLoNCA_g67UwiTy';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
async function searchBookings(){
  const phone=document.getElementById('phone').value.trim();
  if(!phone){ alert('دخل رقم التلفون'); return; }
  document.getElementById('results').innerHTML='⏳ جاري البحث...';
  try{
    const {data,error}=await supabaseClient.from('bookings').select('*').ilike('patient_phone','%'+phone+'%').order('created_at',{ascending:false});
    if(error) throw error;
    if(data.length===0){ document.getElementById('results').innerHTML='<div style="text-align:center;padding:20px;color:#9ca3af">لا يوجد حجوزات بهذا الرقم<br><small>جرب الرقم بدون صفر أو مع مفتاح السودان</small></div>'; return; }
    document.getElementById('results').innerHTML=data.map(b=>{
      const d=new Date(b.created_at).toLocaleString('ar-SD');
      const cls=b.status==='approved'?'approved':b.status==='rejected'?'rejected':'pending';
      const txt=b.status==='approved'?'مؤكد ✅':b.status==='rejected'?'مرفوض ❌':'معلق ⏳ - في انتظار التأكيد';
      return `<div class="booking-card"><div style="display:flex;justify-content:space-between"><b>${b.doctor_name||'دكتور'}</b><span class="badge ${cls}">${txt}</span></div><div style="font-size:11px;color:#6b8a81;margin-top:6px">📅 ${d}<br>👤 ${b.patient_name} - 📞 ${b.patient_phone}<br>🤒 ${b.symptoms||''}<br>💰 ${b.amount||1000}ج بنكك ${b.bank_account||'1833'}</div>${b.status==='approved'?`<div style="margin-top:10px;background:#d1fae5;padding:8px;border-radius:10px;font-size:11px;color:#065f46">✅ تم تأكيد حجزك! سيتم التواصل معك عبر واتساب<br><a href="pharmacies.html" style="color:#065f46;font-weight:800">💊 اطلب دواءك من صيدلية قريبة</a></div>`:''}</div>`;
    }).join('');
  }catch(e){ document.getElementById('results').innerHTML=`❌ خطأ: ${e.message}`; }
}
</script>
</body>
</html>

<style>
*{font-family:'Tajawal',sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:#f4f8f6;color:#0f2a23}
.login-screen{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f2a23,#1a4738);padding:20px}
.login-card{background:#fff;border-radius:24px;padding:28px;width:100%;max-width:380px;text-align:center}
.login-card input{width:100%;border:1.5px solid #e6f2ee;border-radius:100px;padding:12px 16px;margin-top:16px;text-align:center}
.login-card button{width:100%;background:#0f2a23;color:#fff;border:none;padding:12px;border-radius:100px;margin-top:12px;font-weight:800;cursor:pointer}
.header{background:#0f2a23;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:16px}
.stat{background:#fff;border-radius:16px;padding:14px;border:1px solid #e6f2ee}
.stat b{font-size:22px;display:block}
.tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
.tabs button{padding:10px 18px;border-radius:100px;border:1px solid #e6f2ee;background:#fff;font-weight:700;cursor:pointer}
.tabs button.active{background:#0f2a23;color:#fff}
.table-wrap{background:#fff;border-radius:18px;margin:0 16px 16px;border:1px solid #e6f2ee;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f9fdfb;padding:10px;text-align:right;border-bottom:1px solid #e6f2ee}
td{padding:10px;border-bottom:1px solid #f0f0f0}
.btn{padding:6px 12px;border-radius:100px;border:none;font-size:11px;font-weight:700;cursor:pointer;margin:2px}
.btn.add{background:#0f2a23;color:#fff;padding:10px 16px}
.input{border:1.5px solid #e6f2ee;border-radius:12px;padding:10px;width:100%;margin-top:6px}
.badge{padding:3px 8px;border-radius:100px;font-size:10px;font-weight:800}
.badge.pending{background:#fef3c7;color:#92400e}
.badge.approved{background:#d1fae5;color:#065f46}
</style>
</head>

    <div id="addBox" style="display:none;background:#fff;margin:0 16px 12px;padding:14px;border-radius:16px;border:1px solid #e6f2ee">
      <input id="p_name" class="input" placeholder="اسم الصيدلية">
      <input id="p_address" class="input" placeholder="العنوان">
      <input id="p_phone" class="input" placeholder="0912345678">
      <input id="p_url" class="input" placeholder="رابط الخريطة">
      <button class="btn add" style="width:100%;margin-top:8px" onclick="addPharmacy()">💾 حفظ</button>
    </div>
    <div class="table-wrap"><table><thead><tr><th>الصيدلية</th><th>التلفون</th><th>24س</th><th>حذف</th></tr></thead><tbody id="tbodyPharm"></tbody></table></div>
  </div>
  <div id="panel-ai" style="display:none"><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>السؤال</th><th>الإجابة</th></tr></thead><tbody id="tbodyAI"></tbody></table></div></div>
</div>
<script>
const SUPABASE_URL='https://dklfjeupbggrvxpjqqqe.supabase.co'; const SUPABASE_ANON='sb_publishable_lnGtbMJf4P4EeHV6MLoNCA_g67UwiTy'; const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
function login(){ const p=document.getElementById('passInput').value.trim(); if(['ayman123','1833','Ayman123','admin123'].includes(p)){ document.getElementById('loginScreen').style.display='none'; document.getElementById('dashboard').style.display='block'; localStorage.setItem('admin_logged','true'); loadAll(); } else { document.getElementById('loginError').style.display='block'; document.getElementById('loginError').innerText='خطأ - جرب ayman123'; } }
function logout(){localStorage.removeItem('admin_logged');location.reload();}
if(localStorage.getItem('admin_logged')==='true'){document.getElementById('loginScreen').style.display='none';document.getElementById('dashboard').style.display='block';loadAll();}
function switchTab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');document.getElementById('panel-bookings').style.display=t==='bookings'?'block':'none';document.getElementById('panel-pharmacies').style.display=t==='pharmacies'?'block':'none';document.getElementById('panel-ai').style.display=t==='ai'?'block':'none'; if(t==='pharmacies') loadPharm(); if(t==='ai') loadAI();}
async function loadAll(){loadBookings();loadPharm();loadAI();}
async function loadBookings(){ try{ const{data}=await supabaseClient.from('bookings').select('*').order('created_at',{ascending:false}).limit(100); document.getElementById('statToday').innerText=data.length; document.getElementById('statPending').innerText=data.filter(b=>b.status==='pending').length; document.getElementById('tbody').innerHTML=data.map(b=>`<tr><td>${new Date(b.created_at).toLocaleDateString('ar-SD')}</td><td>${b.patient_name}</td><td>${b.patient_phone}</td><td>${b.doctor_name}</td><td><span class="badge ${b.status==='approved'?'approved':'pending'}">${b.status}</span></td><td><button class="btn" onclick="updateStatus('${b.id}','approved')">✅</button></td></tr>`).join(''); }catch(e){} }
async function updateStatus(id,s){await supabaseClient.from('bookings').update({status:s}).eq('id',id);loadBookings();}
async function loadPharm(){ try{ const{data}=await supabaseClient.from('pharmacies').select('*'); document.getElementById('statPharm').innerText=data.length; document.getElementById('tbodyPharm').innerHTML=data.map(p=>`<tr><td>${p.name}</td><td>${p.phone}</td><td>${p.available_24h?'✅':'❌'}</td><td><button class="btn" onclick="delPharm('${p.id}')">🗑️</button></td></tr>`).join(''); }catch(e){} }
async function addPharmacy(){ const name=document.getElementById('p_name').value.trim(); const address=document.getElementById('p_address').value; const phone=document.getElementById('p_phone').value; const url=document.getElementById('p_url').value; if(!name) return alert('اسم الصيدلية'); const{error}=await supabaseClient.from('pharmacies').insert([{name,address,phone,location_url:url,available_24h:true,has_delivery:true,rating:4.8}]); if(error) alert(error.message); else { document.getElementById('addBox').style.display='none'; loadPharm(); } }
async function delPharm(id){ if(!confirm('حذف؟')) return; await supabaseClient.from('pharmacies').delete().eq('id',id); loadPharm(); }
async function loadAI(){ try{ const{data}=await supabaseClient.from('ai_chats').select('*').order('created_at',{ascending:false}).limit(50); document.getElementById('statAI').innerText=data.length; document.getElementById('tbodyAI').innerHTML=data.map(c=>`<tr><td>${new Date(c.created_at).toLocaleDateString('ar-SD')}</td><td style="max-width:200px">${c.question}</td><td style="max-width:200px">${c.answer}</td></tr>`).join(''); }catch(e){} }
</script>

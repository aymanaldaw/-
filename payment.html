<script>
const SUPABASE_URL = 'https://dklfjeupbggrvxpjqqqe.supabase.co';
const SUPABASE_ANON = 'sb_publishable_lnGtbMJf4P4EeHV6MLoNCA_g67UwiTy';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

async function loadDoctors(){
  const select = document.getElementById('doctor');
  try{
    const { data, error } = await supabaseClient.from('doctors').select('*').eq('available', true).order('created_at');
    if(error) throw error;
    if(!data || data.length===0){
      select.innerHTML = '<option>لا يوجد دكاترة - أضف من لوحة التحكم</option>';
      return;
    }
    select.innerHTML = data.map(d=>`<option value="${d.name} - ${d.specialty}">${d.avatar||'🩺'} ${d.name} - ${d.specialty} - ${d.price||1000}ج</option>`).join('');
    
    // اختيار تلقائي من الرئيسية
    const urlDoc = new URLSearchParams(window.location.search).get('doctor');
    const savedDoc = localStorage.getItem('selected_doctor');
    const target = urlDoc || savedDoc;
    if(target){
      for(let opt of select.options){
        if(opt.value.includes(target) || opt.text.includes(target)){
          select.value = opt.value;
          break;
        }
      }
    }
  }catch(e){
    console.error(e);
    select.innerHTML = `
      <option value="د. محمد الأمين - باطنية">🫀 د. محمد الأمين - باطنية</option>
      <option value="د. سارة أحمد - أطفال">👶 د. سارة أحمد - أطفال</option>
      <option value="د. عمر حسن - عظام">🦴 د. عمر حسن - عظام</option>
      <option value="د. ندى مصطفى - نساء وولادة">🤰 د. ندى مصطفى - نساء وولادة</option>
    `;
  }
}

async function submitBooking(){
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const doctor = document.getElementById('doctor').value;
  const symptoms = document.getElementById('symptoms').value.trim();
  const receiptNo = document.getElementById('receipt_no').value.trim();
  const file = document.getElementById('receipt').files[0];
  if(!name || !phone){ showError('دخل الاسم والتلفون'); return; }
  const btn = document.getElementById('submitBtn');
  const errDiv = document.getElementById('error');
  const succDiv = document.getElementById('success');
  errDiv.style.display='none'; succDiv.style.display='none';
  btn.innerText='⏳ جاري الحفظ سحابيا...'; btn.disabled=true;
  let receiptUrl = '';
  try{
    if(file){
      const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g,'_')}`;
      const { error: uploadError } = await supabaseClient.storage.from('receipts').upload(fileName, file);
      if(!uploadError){
        const { data: urlData } = supabaseClient.storage.from('receipts').getPublicUrl(fileName);
        receiptUrl = urlData.publicUrl;
      }
    }
    const { data, error } = await supabaseClient.from('bookings').insert([{
      patient_name: name,
      patient_phone: phone,
      doctor_name: doctor,
      doctor_spec: 'عام',
      symptoms: symptoms,
      amount: 1000,
      bank_account: '1833',
      receipt_image_url: receiptUrl,
      receipt_number: receiptNo,
      status: 'pending'
    }]).select();
    if(error) throw error;

    localStorage.setItem('last_booking_phone', phone);
    localStorage.setItem('last_booking_name', name);

    const customerWAMsg = `مرحبا ${name} 👋\n\n✅ تم استلام حجزك في طبيبك السودان - متكامل 100%\n\n👨‍⚕️ الدكتور: ${doctor}\n💰 المبلغ: 1000ج بنكك 1833\n📸 الإشعار: ${receiptNo||'مرفوع'} \n\n⏳ حالة الحجز: قيد المراجعة\nسيتم تأكيد حجزك بواتساب خلال دقائق\n\nتتبع حجزك: https://tabeebak-sudan-aymanaldaws-projects.vercel.app/my-booking.html\n\nشكرا لثقتك 🙏`;
    const waCustomerLink = `https://wa.me/249912345678?text=${encodeURIComponent(customerWAMsg)}`;
    
    succDiv.innerHTML=`<b>✅ تم تأكيد الحجز بنجاح! متكامل 100%</b><br>الاسم: ${name}<br>الدكتور: ${doctor}<br>1000ج بنكك 1833 ✅<br><br>تم الحفظ سحابيا + واتساب`;
    succDiv.style.display='block';
    document.getElementById('waAfterBooking').style.display='block';
    document.getElementById('waCustomerLink').href = waCustomerLink;
    btn.innerText='✅ تم الحفظ سحابيا 100%!';

    document.getElementById('name').value=''; document.getElementById('phone').value=''; document.getElementById('symptoms').value=''; document.getElementById('receipt_no').value=''; document.getElementById('receipt').value='';
    btn.disabled=false;
    setTimeout(()=>{ window.open(waCustomerLink, '_blank'); }, 1500);

  }catch(e){
    showError(e.message);
    btn.innerText='✅ تأكيد الحجز - 1000ج';
    btn.disabled=false;
  }
}
function showError(msg){ const errDiv=document.getElementById('error'); errDiv.innerHTML=`❌ ${msg}`; errDiv.style.display='block'; }

loadDoctors();
</script>

  }
}

function showError(msg){
  const errDiv = document.getElementById('error');
  errDiv.innerHTML = `❌ ${msg}<br><br><small>الحل: شغل FIX-RLS-FINAL.sql في Supabase</small>`;
  errDiv.style.display='block';
}

<script>
function save(){
  const url=document.getElementById('url').value.trim();
  const anon=document.getElementById('anon').value.trim();
  const service=document.getElementById('service').value.trim();
  if(!url||!anon){
    document.getElementById('error').style.display='block';
    document.getElementById('error').innerText='❌ دخل URL و Publishable Key';
    return;
  }
  localStorage.setItem('supabase_url', url);
  localStorage.setItem('supabase_anon', anon);
  localStorage.setItem('supabase_service', service);
  localStorage.setItem('supabase_connected','true');
  document.getElementById('success').style.display='block';
  document.getElementById('success').innerHTML=`✅ تم الحفظ!<br>URL: ${url}<br>Key: ${anon.substring(0,20)}...<br><br>الآن افتح لوحة التحكم السحابية!`;
  document.getElementById('error').style.display='none';
}
window.onload=()=>{
  if(localStorage.getItem('supabase_url')) document.getElementById('url').value=localStorage.getItem('supabase_url');
  if(localStorage.getItem('supabase_anon')) document.getElementById('anon').value=localStorage.getItem('supabase_anon');
  if(localStorage.getItem('supabase_service')) document.getElementById('service').value=localStorage.getItem('supabase_service');
}
</script>
